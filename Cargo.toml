[workspace]
resolver = "2"
members = [
    "crates/eve-proto",
    "crates/eve-machonet",
    "crates/eve-sde",
    "crates/eve-dogma",
    "crates/eve-destiny",
    "crates/eve-db",
    "crates/eve-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
authors = ["EvoMu contributors"]

[workspace.dependencies]
bytes = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flate2 = "1.0"
glam = { version = "0.29", features = ["serde"] }
