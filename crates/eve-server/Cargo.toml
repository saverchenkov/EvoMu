[package]
name = "eve-server"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
eve-proto = { path = "../eve-proto" }
eve-machonet = { path = "../eve-machonet" }
eve-sde = { path = "../eve-sde" }
eve-dogma = { path = "../eve-dogma" }
eve-destiny = { path = "../eve-destiny" }
eve-db = { path = "../eve-db" }
anyhow.workspace = true
bytes.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
rusqlite.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true

[features]
default = []
demo-seed = ["eve-db/demo-seed"]

[dev-dependencies]
eve-db = { path = "../eve-db", features = ["demo-seed"] }
eve-server = { path = ".", features = ["demo-seed"] }
eve-testkit = { path = "../eve-testkit" }

[[test]]
name = "it"
path = "tests/it/main.rs"
