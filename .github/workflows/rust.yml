name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Clippy (large_futures)
      run: cargo clippy -p eve-server --all-targets -- -A clippy::all -D clippy::large_futures
    - name: Run tests
      run: cargo test --verbose
